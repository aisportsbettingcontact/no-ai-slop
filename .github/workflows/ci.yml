name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Build · typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages (tsc -b, project references)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit + contract tests
        run: pnpm test

      - name: Definition of Done summary
        run: node scripts/dod.mjs

      - name: App typecheck + production build
        run: pnpm --filter @nas/app run typecheck && pnpm --filter @nas/app run build

      - name: End-to-end lifecycle (nas demo, fail-closed)
        env:
          NAS_SIGNING_KEY: ci-local-signing-key-000001
        run: node packages/cli/dist/cli.js demo

  browser:
    name: Responsive + accessibility (Chromium)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Chromium for Playwright
        run: npx playwright@1.49.1 install --with-deps chromium

      - name: Build app
        run: pnpm --filter @nas/app run build

      - name: Start app + run responsive/a11y scan
        run: |
          (cd apps/no-ai-slop && NAS_SIGNING_KEY=ci-unused pnpm start &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          node apps/no-ai-slop/e2e/browser-check.mjs http://localhost:3000 apps/no-ai-slop/e2e/screenshots
